<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота 5 - Ajax Catalog</title>
    <link rel="shortcut icon" href="#">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #ccc; }
        nav a { margin-right: 20px; font-size: 18px; text-decoration: none; color: #0056b3; font-weight: bold; cursor: pointer; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; }
        .card { border: 1px solid #ddd; padding: 15px; width: 220px; border-radius: 6px; text-align: center; }
        .card img { width: 200px; height: 200px; object-fit: cover; margin-bottom: 10px; }
        .price { font-weight: bold; color: green; margin-top: 8px; }
        .cat-link { display: block; font-size: 18px; margin: 10px 0; color: #0056b3; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a id="catalog-link">Catalog</a>
    </nav>

    <div id="content"></div>

    <script src="script.js"></script>
</body>
</html>
